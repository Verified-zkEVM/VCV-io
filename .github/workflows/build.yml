name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_imported:
    name: Check Library File Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PMF/SPMF boundary ratchet diffs against the pull-request base.
          fetch-depth: 0

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Check PolyFun public boundary
        run: |
          bash scripts/test-polyfun-boundary.sh
          bash scripts/check-polyfun-boundary.sh

      - name: Check PMF/SPMF dependency boundary
        run: |
          bash scripts/test-pmf-boundary.sh
          bash scripts/check-pmf-boundary.sh

      - name: Report PMF/SPMF boundary trend
        if: github.event_name == 'pull_request'
        run: bash scripts/check-pmf-boundary.sh --report "origin/${{ github.base_ref }}"

      - name: Check optional complexity backend isolation
        run: |
          bash scripts/test-complexity-backend-isolation.sh
          bash scripts/check-complexity-backend-isolation.sh

      - name: Check for all imports in ToMathlib
        run: lake exe mk_all --lib ToMathlib --module --check

      - name: Check for all imports in VCVio
        run: lake exe mk_all --lib VCVio --module --check

      - name: Check for all imports in LatticeCrypto
        run: lake exe mk_all --lib LatticeCrypto --module --check

      - name: Check for all imports in Extern
        run: lake exe mk_all --lib Extern --module --check

      - name: Check for all imports in HashSig
        run: lake exe mk_all --lib HashSig --module --check

      - name: Check for all imports in Examples
        run: lake exe mk_all --lib Examples --module --check

      - name: Check for all imports in VCVioWidgets
        run: lake exe mk_all --lib VCVioWidgets --module --check

      - name: Check for all imports in VCVioTest
        run: lake exe mk_all --lib VCVioTest --module --check

  complexity_backend:
    name: Optional Complexity Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Materialize the pinned PolyFun checkout
        run: lake update PolyFun

      - name: Fetch Mathlib cache for the optional package
        working-directory: VCVioComplexity
        run: |
          lake update
          lake exe cache get

      - name: Run exact-machine canaries, trust checks, and compatibility preflight
        working-directory: VCVioComplexity
        run: ./scripts/test.sh

  downstream_stub_link:
    name: Downstream Consumer Build (no submodules)
    runs-on: ubuntu-latest
    steps:
      # No `submodules:` input on purpose: this job reproduces issue #495. A
      # downstream `require VCVio` never has the third_party/ submodules
      # checked out, yet Lake links every dependency `extern_lib` into any
      # consumer `lean_exe`, so the native targets must degrade gracefully.
      - uses: actions/checkout@v4
      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          # The scratch consumer has its own package directory, hydrated below.
          use-mathlib-cache: false
      - name: Build a scratch consumer requiring VCVio by path
        env:
          # Defer cache hydration until the scratch consumer's manifest exists.
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          consumer="$RUNNER_TEMP/vcvio-consumer"
          mkdir -p "$consumer"
          cp lean-toolchain "$consumer/"
          {
            echo 'name = "consumer"'
            echo 'defaultTargets = ["consumer"]'
            echo ''
            echo '[[require]]'
            echo 'name = "VCVio"'
            echo "path = \"$GITHUB_WORKSPACE\""
            echo ''
            echo '[[lean_exe]]'
            echo 'name = "consumer"'
            echo 'root = "Main"'
          } > "$consumer/lakefile.toml"
          {
            echo 'module'
            echo ''
            echo '-- `public import`: the universe example below is a `public` declaration, so'
            echo '-- the names in its type must be publicly imported, not just privately visible.'
            echo 'public import VCVio'
            echo 'public import VCVio.EvalDist.PFunctor'
            echo ''
            echo '#check OracleComp'
            echo '#check PFunctor.IsProbabilitySpec'
            echo '#check PFunctor.Handler.preInsert'
            echo ''
            echo '-- A downstream consumer whose oracle responses do not live in `Type 0`.'
            echo '-- The public simulation-composition laws must apply at that generality:'
            echo '-- a law that only holds at `Type 0` is not a reusable replacement for a'
            echo '-- downstream adapter, which is exactly how ArkLib ended up carrying local'
            echo '-- copies of six of them.'
            echo 'universe uQuery uTarget'
            echo ''
            echo 'public example {i1 : Type} {i2 : Type}'
            echo '    {s1 : OracleSpec.{0, uQuery} i1} {s2 : OracleSpec.{0, uQuery} i2}'
            echo '    {t : Type uQuery -> Type uTarget} [Monad t] [LawfulMonad t]'
            echo '    (f1 : QueryImpl s1 t) (f2 : QueryImpl s2 t)'
            echo '    {A : Type uQuery} (x : OracleComp s1 A) :'
            echo '    simulateQ (f1 + f2) (liftM x : OracleComp (s1 + s2) A) ='
            echo '      simulateQ f1 x :='
            echo '  QueryImpl.simulateQ_add_liftM_left f1 f2 x'
            echo ''
            echo 'public def main : IO Unit := IO.println "consumer ok"'
          } > "$consumer/Main.lean"
          cd "$consumer"
          lake update
          lake exe cache get
          lake build
          ./.lake/build/bin/consumer

  build:
    name: Build Project
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/build-timing.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/build-timing-logs" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_DIR=$RUNNER_TEMP/build-timing-artifact" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_NAME=build-timing-data" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASELINE_DIR=$RUNNER_TEMP/build-timing-baseline" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_REPORT=$RUNNER_TEMP/build-timing.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_COMMENT=$RUNNER_TEMP/build-timing-comment.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASE_REF=" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_CLEAN_COMMAND=rm -rf .lake/build && lake build ToMathlib VCVio LatticeCrypto Extern HashSig Examples VCVioWidgets" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_WARM_COMMAND=lake build ToMathlib VCVio LatticeCrypto Extern HashSig Examples VCVioWidgets" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_NAME=Smoke test" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_TEST_COMMAND=lake env lean VCVioTest/Smoke.lean" >> "$GITHUB_ENV"
          {
            echo "BUILD_TIMING_SOURCE_SUBJECT<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Determine PR timing base ref
        if: github.event_name == 'pull_request'
        run: |
          echo "BUILD_TIMING_BASE_REF=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
      - name: Restore Lake cache
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Time clean build
        run: |
          bash scripts/build_timing_report.sh run clean_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c "$BUILD_TIMING_CLEAN_COMMAND"
      - name: Check warning budget
        run: |
          python3 ./scripts/check-warning-log.py "$BUILD_TIMING_LOG_DIR/clean_build.log" \
            --path-prefix ToMathlib/ \
            --path-prefix VCVio/ \
            --path-prefix Extern/ \
            --path-prefix LatticeCrypto/ \
            --path-prefix HashSig/ \
            --path-prefix Examples/ \
            --path-prefix VCVioWidgets/ \
            --path-prefix ToMathlib.lean \
            --path-prefix VCVio.lean \
            --path-prefix Extern.lean \
            --path-prefix LatticeCrypto.lean \
            --path-prefix HashSig.lean \
            --path-prefix Examples.lean \
            --path-prefix VCVioWidgets.lean \
            --exclude-substring 'declaration uses `sorry`' \
            --label 'repository non-sorry warnings'
      - name: Time warm rebuild
        run: |
          bash scripts/build_timing_report.sh run warm_rebuild "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c "$BUILD_TIMING_WARM_COMMAND"
      - name: Time test module
        run: |
          bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake env lean VCVioTest/Smoke.lean'
      # Enforcing from day one: new taint (exit 1: `sorryAx` or non-standard axioms not in
      # the committed baseline) fails the build, as do infrastructure failures (exit 2:
      # missing or unparsable baseline, tool breakage) — a broken tool must never read as
      # a clean verdict.
      # Sweeps the non-test libraries; Interop (the declared TCB) is bounded by
      # its import-isolation gate instead.
      # Exercise the sweep against its own fixtures before trusting its verdict on the
      # library: the fixtures carry synthetic taint of each shape the tool reasons about
      # (direct and transitive `sorryAx`, an axiom occurring only in a type, a mutual
      # family whose taint crosses the cycle, generated `._native.` name shapes), plus
      # the exit-code matrix CI depends on.
      - name: Test the axiom sweep tool
        run: ./scripts/test-axiomsweep.sh
      - name: Axiom sweep
        run: lake exe axiomsweep --check
      # Build the whole canary library rather than a hand-maintained list of
      # `lake env lean` invocations. Every module reachable from `VCVioTest.lean` is
      # elaborated, so a canary added in a future PR is covered the moment
      # `./scripts/update-lib.sh` registers it. `mk_all --lib VCVioTest --module --check`
      # above only checks that the umbrella's import list is textually complete; it does
      # not elaborate anything. Kept out of the timed build commands on purpose: the
      # timing report compares exactly the seven non-test libraries.
      - name: Build the canary library
        shell: bash  # explicit bash gives pipefail; the default `bash -e {0}` does not
        run: lake build VCVioTest 2>&1 | tee "$BUILD_TIMING_LOG_DIR/test_build.log"
      # The canary library is the tactic gate: a warning there (an unused tactic, a
      # redundant `grind` parameter, a deprecated name) is a gate entry going stale, so
      # it fails the job like a proof-library warning does. Dependency logs are replayed
      # into this output too, hence the `VCVioTest` path prefixes: the five `sorry`
      # warnings under `VCVio/CryptoFoundations/**` are the proof-library gate's business.
      - name: Check canary warning budget
        run: |
          python3 ./scripts/check-warning-log.py "$BUILD_TIMING_LOG_DIR/test_build.log" \
            --path-prefix VCVioTest/ \
            --path-prefix VCVioTest.lean \
            --label 'VCVioTest warnings'
      # `LatticeCryptoTest.lean` deliberately omits the native `Main` executables,
      # which remain covered by the nightly FFI workflow. Building this library
      # elaborates every Lean-only lattice helper, vector, and regression canary.
      - name: Build the lattice crypto test library
        run: lake build LatticeCryptoTest
      - name: Build HashSig oracle canaries
        run: lake build HashSigTest
      - name: Run SLH-DSA-SHA2-128-24 differential KAT
        run: lake exe slhdsa_kat
      - name: Run SLH-DSA-C13 differential KAT
        run: lake exe slhdsa_c13_kat
      - name: Run SLH-DSA structured-codec boundary tests
        run: lake exe slhdsa_data_codec_tests
      - name: Run SLH-DSA primitive vector tests
        run: lake exe slhdsa_primitive_tests
      - name: Run SLH-DSA WOTS construction tests
        run: lake exe slhdsa_wots_tests
      - name: Run SLH-DSA XMSS construction tests
        run: lake exe slhdsa_xmss_tests
      - name: Run SLH-DSA FORS construction tests
        run: lake exe slhdsa_fors_tests
      - name: Run SLH-DSA hypertree conformance tests
        run: lake exe slhdsa_hypertree_tests
      - name: Run SLH-DSA external-interface tests
        run: lake exe slhdsa_external_tests
      # - name: Run ML-KEM tests
      #   run: |
      #     .lake/build/bin/mlkem_test
      - name: Save Lake cache
        if: success() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Prepare timing artifact
        if: always()
        run: |
          rm -rf "$BUILD_TIMING_ARTIFACT_DIR"
          mkdir -p "$BUILD_TIMING_ARTIFACT_DIR"
          if [ -f "$BUILD_TIMING_RESULTS" ]; then
            cp "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/clean_build.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/clean_build.log" "$BUILD_TIMING_ARTIFACT_DIR/clean_build.log"
          fi
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Determine comparison baseline artifact
        if: always() && github.event_name == 'pull_request'
        id: timing-baseline
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactName = process.env.BUILD_TIMING_ARTIFACT_NAME;
            const workflowName = process.env.GITHUB_WORKFLOW;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentSha = process.env.GITHUB_SHA;
            const pullRequest = context.payload.pull_request;
            const headRef = pullRequest.head.ref;
            const baseRef = process.env.BUILD_TIMING_BASE_REF;

            async function firstRunWithArtifact(runs) {
              for (const run of runs) {
                if (run.id === currentRunId) {
                  continue;
                }
                if (run.name !== workflowName || run.conclusion !== 'success') {
                  continue;
                }
                const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const artifact = artifactsResponse.data.artifacts.find(candidate =>
                  candidate.name === artifactName && !candidate.expired
                );
                if (artifact) {
                  return run;
                }
              }
              return null;
            }

            const baseRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'push',
              branch: baseRef,
              status: 'completed',
              per_page: 100,
            });
            const baseCandidates = baseRunsResponse.data.workflow_runs.filter(run =>
              run.name === workflowName && run.conclusion === 'success'
            );
            const baseRun = await firstRunWithArtifact(baseCandidates);
            if (baseRun) {
              core.setOutput('run-id', String(baseRun.id));
              core.setOutput('sha', baseRun.head_sha);
              core.setOutput(
                'label',
                `the latest successful \`${baseRef}\` run`
              );
              return;
            }

            const prRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              branch: headRef,
              status: 'completed',
              per_page: 100,
            });
            const previousPrCandidates = prRunsResponse.data.workflow_runs.filter(run => {
              if (run.head_sha === currentSha) {
                return false;
              }
              const prs = run.pull_requests || [];
              return prs.length === 0 || prs.some(pr => pr.number === pullRequest.number);
            });
            const previousPrRun = await firstRunWithArtifact(previousPrCandidates);
            if (previousPrRun) {
              core.setOutput('run-id', String(previousPrRun.id));
              core.setOutput('sha', previousPrRun.head_sha);
              core.setOutput('label', 'the previous successful PR update');
              return;
            }

            core.info('No comparison baseline artifact found.');
            core.setOutput('run-id', '');
            core.setOutput('sha', '');
            core.setOutput('label', '');
      - name: Download comparison baseline artifact
        if: always() && steps.timing-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_BASELINE_DIR }}
          run-id: ${{ steps.timing-baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Render build timing report
        if: always()
        env:
          BUILD_TIMING_BASELINE_LABEL: ${{ steps.timing-baseline.outputs.label }}
          BUILD_TIMING_BASELINE_SHA: ${{ steps.timing-baseline.outputs.sha }}
        run: |
          if [ -f "$BUILD_TIMING_BASELINE_DIR/results.jsonl" ]; then
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_BASELINE_DIR" > "$BUILD_TIMING_REPORT"
          else
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" > "$BUILD_TIMING_REPORT"
          fi
          cat "$BUILD_TIMING_REPORT" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- vcvio-build-timing-report -->'
            echo
            cat "$BUILD_TIMING_REPORT"
          } > "$BUILD_TIMING_COMMENT"
      - name: Upsert build timing PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vcvio-build-timing-report -->';
            const body = fs.readFileSync(process.env.BUILD_TIMING_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
