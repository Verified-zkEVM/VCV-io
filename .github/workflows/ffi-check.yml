name: FFI Nightly Check

# Builds and runs the native-backed FFI test executables (ML-KEM / ML-DSA /
# Falcon) against the vendored reference implementations in third_party/.
# This is the ONLY job that links the native .o files, so it is kept off the
# per-PR path (expensive: three amalgamated C backends + three linked exes)
# and run nightly instead. Trigger manually via the Actions tab when touching
# FFI glue or bumping a third_party submodule pin.

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffi-check:
    name: Build + run FFI test executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch Mathlib cache
        run: lake exe cache get

      # The same driver as the per-PR `lake test`, with the native-backed executables added.
      - name: Run the test driver with the native executables
        run: lake test -- --ffi
