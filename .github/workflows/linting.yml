name: Lint Style

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "ToMathlib/**/*.lean"
      - "VCVio/**/*.lean"
      - "VCVioTest.lean"
      - "VCVioTest/**/*.lean"
      - "LatticeCryptoTest.lean"
      - "LatticeCryptoTest/**/*.lean"
      - "Extern/**/*.lean"
      - "LatticeCrypto/**/*.lean"
      - "HashSig.lean"
      - "HashSig/**/*.lean"
      - "HashSigTest/**/*.lean"
      - "Examples/**/*.lean"
      - "VCVioWidgets/**/*.lean"
      - "Interop.lean"
      - "Interop/**/*.lean"
      - "lakefile.lean"
      - "scripts/nolints-style.txt"
      - ".github/workflows/linting.yml"
  # Merge-queue refs must run independently of PR path filters: the group can
  # contain changes from several pull requests.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "ToMathlib/**/*.lean"
      - "VCVio/**/*.lean"
      - "VCVioTest.lean"
      - "VCVioTest/**/*.lean"
      - "LatticeCryptoTest.lean"
      - "LatticeCryptoTest/**/*.lean"
      - "Extern/**/*.lean"
      - "LatticeCrypto/**/*.lean"
      - "HashSig.lean"
      - "HashSig/**/*.lean"
      - "HashSigTest/**/*.lean"
      - "Examples/**/*.lean"
      - "VCVioWidgets/**/*.lean"
      - "Interop.lean"
      - "Interop/**/*.lean"
      - "lakefile.lean"
      - "scripts/nolints-style.txt"
      - ".github/workflows/linting.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Repo-wide hygiene checks that the old `scripts/lint-style.sh` enforced.
      - name: Check for executable Lean files
        run: |
          execs="$(git ls-files -s '*.lean' | grep -E '^100755 ' | cut -f2-)"
          if [ -n "$execs" ]; then
            echo "ERROR: the following Lean files have the executable bit set:"
            echo "$execs"
            exit 1
          fi

      - name: Check for case-insensitive filename clashes
        run: |
          clashes="$(git ls-files | sort --ignore-case | uniq -D --ignore-case)"
          if [ -n "$clashes" ]; then
            echo "ERROR: the following files have the same lower-case form:"
            echo "$clashes"
            exit 1
          fi

      - name: Set up Lean environment
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch Mathlib cache
        run: lake exe cache get

      # `lake exe lint-style` resolves to Mathlib's text-based style linter (the
      # project deliberately defines no `lint-style` exe, so it does not link the
      # FFI backends). Libraries are passed by name; the test modules are expanded
      # from git because `HashSigTest` has no umbrella and `LatticeCryptoTest.lean`
      # is curated.
      - name: Run text-based style linters
        run: |
          test_modules=$(git ls-files 'VCVioTest/*.lean' 'LatticeCryptoTest/*.lean' \
            'HashSigTest/*.lean' | sed -e 's/\.lean$//' -e 's#/#.#g')
          # shellcheck disable=SC2086
          lake exe lint-style ToMathlib VCVio Extern LatticeCrypto HashSig Examples VCVioWidgets \
            Interop $test_modules
